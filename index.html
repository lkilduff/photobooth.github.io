<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Photo Booth</title>
<style>
  /* ---- Theme: change these colors to match your party ---- */
  :root {
    --accent: #ff4f8b;
    --bg: #16121f;
    --text: #ffffff;
    --muted: #b8b0c9;
    --error: #ffb4c8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  .screen {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .screen.active { display: flex; }

  h1 { font-size: 2rem; margin-bottom: 12px; }
  .sub { color: var(--muted); margin-bottom: 24px; line-height: 1.45; max-width: 360px; }

  .button, button {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .ghost { background: transparent !important; border: 2px solid var(--accent) !important; }
  button:disabled { opacity: .5; cursor: default; }

  #stage {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
  }
  #liveCanvas { width: 100%; height: 100%; display: block; }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  #countdown {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    font-size: 7rem; font-weight: 800; color: #fff;
    text-shadow: 0 4px 24px rgba(0, 0, 0, .6);
    pointer-events: none;
  }

  #thumbs {
    display: flex;
    gap: 10px;
    margin: 16px 0;
    overflow-x: auto;
    max-width: 100%;
    padding: 4px;
  }
  .thumb {
    flex: 0 0 auto;
    width: 60px; height: 60px;
    border-radius: 12px;
    border: 3px solid transparent;
    padding: 0;
    background: #2a2338;
    color: #fff;
    font-size: 1.6rem;
    font-weight: 400;
    overflow: hidden;
    cursor: pointer;
  }
  .thumb.selected { border-color: #fff; }
  .thumb canvas { width: 100%; height: 100%; display: block; }

  #resultImg {
    width: 100%;
    max-width: 400px;
    border-radius: 18px;
    margin-bottom: 20px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #error, #welcomeError { color: var(--error); margin-top: 16px; min-height: 1.4em; max-width: 360px; }
  .hidden { display: none !important; }
  .offscreen {
    position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<video id="video" class="offscreen" playsinline muted autoplay></video>
<input type="file" id="fileInput" accept="image/*" class="offscreen" />

<!-- Screen 1: welcome -->
<section id="welcome" class="screen active">
  <h1 id="title">Photo Booth</h1>
  <p class="sub">Pick a background, strike a pose, and take your photo. Your picture stays on your phone unless you save or share it.</p>
  <button id="startBtn">Start</button>
</section>

<!-- Screen 2: live booth -->
<section id="booth" class="screen">
  <div id="stage">
    <canvas id="liveCanvas" width="540" height="720"></canvas>
    <div id="loading">Loading camera...</div>
    <div id="countdown"></div>
  </div>
  <div id="thumbs"></div>
  <div class="row">
    <button id="shootBtn">Take photo</button>
    <button id="doneBtn" class="ghost">Done</button>
  </div>
  <p id="error"></p>
</section>

<!-- Screen 3: result -->
<section id="result" class="screen">
  <img id="resultImg" alt="Your photo" />
  <div class="row">
    <a id="downloadBtn" class="button" href="#" download="booth-photo.jpg">Save photo</a>
    <button id="shareBtn" class="ghost hidden">Share</button>
    <button id="retakeBtn" class="ghost">Retake</button>
    <button id="nextBtn" class="ghost">Next guest</button>
  </div>
</section>

<!-- MediaPipe selfie segmentation (loads the person-detection model) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>

<script>
  /* ---- Settings: edit these ---- */
  const CONFIG = {
    eventName: "",          // e.g. "Lily's 30th" - shown on the title and printed on each photo
    countdownSeconds: 3,
  };

  /* ---- Code below this line usually doesn't need changes ---- */
  const W = 540, H = 720;
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  const video = $('video');
  const liveCanvas = $('liveCanvas');
  const ctx = liveCanvas.getContext('2d');

  // Offscreen canvas used to build the person-only layer
  const personCanvas = document.createElement('canvas');
  personCanvas.width = W;
  personCanvas.height = H;
  const pctx = personCanvas.getContext('2d', { willReadFrequently: true });

  let customImg = null;

  // Draws an image so it fills the area and is centered (cropping the edges as needed)
  function drawCover(c, img, w, h) {
    const s = Math.max(w / img.width, h / img.height);
    const dw = img.width * s, dh = img.height * s;
    c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  const BACKGROUNDS = [
    {
      name: 'Sunset',
      draw(c, w, h) {
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#ffb199');
        g.addColorStop(0.5, '#ff5f8a');
        g.addColorStop(1, '#5b2a86');
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);
      }
    },
    {
      name: 'Ocean',
      draw(c, w, h) {
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#4facfe');
        g.addColorStop(1, '#00335c');
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);
      }
    },
    {
      name: 'Party',
      draw(c, w, h) {
        c.fillStyle = '#1d1433';
        c.fillRect(0, 0, w, h);
        const cols = ['#ff4f8b', '#ffd166', '#06d6a0', '#4cc9f0'];
        for (let i = 0; i < 120; i++) {
          c.fillStyle = cols[i % 4];
          c.beginPath();
          c.arc((i * 97) % w, (i * 181) % h, 6 + (i % 5) * 2, 0, Math.PI * 2);
          c.fill();
        }
      }
    },
    {
      name: 'Custom',
      custom: true,
      draw(c, w, h) {
        if (customImg) {
          drawCover(c, customImg, w, h);
        } else {
          c.fillStyle = '#3a3450';
          c.fillRect(0, 0, w, h);
        }
      }
    }
  ];
  let bgIndex = 0;

  function renderThumbs() {
    const box = $('thumbs');
    box.innerHTML = '';
    BACKGROUNDS.forEach((bg, i) => {
      const b = document.createElement('button');
      b.className = 'thumb' + (i === bgIndex ? ' selected' : '');
      b.setAttribute('aria-label', bg.name);
      if (bg.custom && !customImg) {
        b.textContent = '+';
      } else {
        const c = document.createElement('canvas');
        c.width = 120; c.height = 120;
        bg.draw(c.getContext('2d'), 120, 120);
        b.appendChild(c);
      }
      b.onclick = () => {
        // Custom tile: opens the photo picker unless it's already chosen
        if (bg.custom && (!customImg || bgIndex === i)) {
          $('fileInput').click();
          return;
        }
        bgIndex = i;
        renderThumbs();
      };
      box.appendChild(b);
    });
  }

  $('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.src = URL.createObjectURL(file);
    try {
      await img.decode();
      customImg = img;
      bgIndex = BACKGROUNDS.findIndex(b => b.custom);
      renderThumbs();
    } catch (err) {
      setError('Could not load that photo. Try another one.');
    }
    e.target.value = '';
  });

  // ---- Person segmentation ----
  let selfie = null;

  function initSegmentation() {
    if (typeof SelfieSegmentation === 'undefined') return false;
    selfie = new SelfieSegmentation({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`
    });
    selfie.setOptions({ modelSelection: 1 });
    selfie.onResults(onResults);
    return true;
  }

  // Returns the position/size to draw a source so it fills the W x H canvas
  function coverRect(sw, sh) {
    const s = Math.max(W / sw, H / sh);
    const dw = sw * s, dh = sh * s;
    return { x: (W - dw) / 2, y: (H - dh) / 2, w: dw, h: dh };
  }

  function onResults(results) {
    const mask = results.segmentationMask;
    const cover = coverRect(mask.width, mask.height);

    // 1. Build the person layer, mirrored like a selfie camera
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.globalCompositeOperation = 'source-over';
    pctx.clearRect(0, 0, W, H);
    pctx.save();
    pctx.translate(W, 0);
    pctx.scale(-1, 1);
    pctx.drawImage(mask, cover.x, cover.y, cover.w, cover.h);
    pctx.restore();

    // Turn the mask's brightness into transparency (white = person)
    const imgData = pctx.getImageData(0, 0, W, H);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i + 3] = d[i];
    }
    pctx.putImageData(imgData, 0, 0);

    // Keep only the pixels of the person from the camera frame
    pctx.save();
    pctx.globalCompositeOperation = 'source-in';
    pctx.translate(W, 0);
    pctx.scale(-1, 1);
    const vw = results.image.videoWidth || results.image.width;
    const vh = results.image.videoHeight || results.image.height;
    const vc = coverRect(vw, vh);
    pctx.drawImage(results.image, vc.x, vc.y, vc.w, vc.h);
    pctx.restore();

    // 2. Draw the chosen background, then the person on top
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    BACKGROUNDS[bgIndex].draw(ctx, W, H);
    ctx.drawImage(personCanvas, 0, 0);
  }

  // ---- Camera loop ----
  let running = false;
  let busy = false;
  let stream = null;

  async function frame() {
    if (!running) return;
    if (!busy && video.readyState >= 2) {
      busy = true;
      try {
        await selfie.send({ image: video });
      } catch (e) {
        console.error(e);
      }
      busy = false;
    }
    requestAnimationFrame(frame);
  }

  function setError(msg) {
    $('error').textContent = msg;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  }

  function stopBooth() {
    running = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
  }

  async function startBooth() {
    showScreen('booth');
    setError('');
    $('loading').style.display = 'flex';
    $('shootBtn').disabled = false;
    renderThumbs();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setError('The camera needs a secure (https) link. Open this page from its https address.');
      return;
    }
    if (!selfie && !initSegmentation()) {
      setError('Could not load the background tool. Check your internet connection and try again.');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      await video.play();
    } catch (e) {
      setError('Please allow camera access in your browser settings, then tap Start again.');
      return;
    }

    $('loading').style.display = 'none';
    running = true;
    frame();
  }

  // ---- Taking the photo ----
  async function takePhoto() {
    $('shootBtn').disabled = true;
    const cd = $('countdown');
    cd.style.display = 'flex';
    for (let s = CONFIG.countdownSeconds; s > 0; s--) {
      cd.textContent = s;
      await wait(1000);
    }
    cd.style.display = 'none';

    const out = document.createElement('canvas');
    out.width = W;
    out.height = H;
    const octx = out.getContext('2d');
    octx.drawImage(liveCanvas, 0, 0, W, H);

    if (CONFIG.eventName) {
      const fs = Math.round(H * 0.05);
      octx.font = `700 ${fs}px system-ui, sans-serif`;
      octx.textAlign = 'center';
      octx.fillStyle = '#fff';
      octx.shadowColor = 'rgba(0, 0, 0, .6)';
      octx.shadowBlur = 12;
      octx.fillText(CONFIG.eventName, W / 2, H - fs);
    }

    out.toBlob(blob => {
      $('shootBtn').disabled = false;
      showResult(blob);
    }, 'image/jpeg', 0.92);
  }

  let resultBlob = null;
  let resultUrl = null;

  function showResult(blob) {
    stopBooth();
    resultBlob = blob;
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $('resultImg').src = resultUrl;
    const dl = $('downloadBtn');
    dl.href = resultUrl;
    dl.download = 'booth-photo.jpg';

    const file = new File([blob], 'booth-photo.jpg', { type: 'image/jpeg' });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    $('shareBtn').classList.toggle('hidden', !canShare);

    showScreen('result');
  }

  // ---- Buttons ----
  $('startBtn').onclick = startBooth;
  $('shootBtn').onclick = takePhoto;
  $('doneBtn').onclick = () => { stopBooth(); showScreen('welcome'); };
  $('retakeBtn').onclick = startBooth;
  $('nextBtn').onclick = () => { stopBooth(); showScreen('welcome'); };

  $('shareBtn').onclick = async () => {
    try {
      const file = new File([resultBlob], 'booth-photo.jpg', { type: 'image/jpeg' });
      await navigator.share({ files: [file], title: CONFIG.eventName || 'Photo booth' });
    } catch (e) {
      // User cancelled the share sheet; nothing to do
    }
  };

  // ---- Setup ----
  $('title').textContent = CONFIG.eventName ? `${CONFIG.eventName} Photo Booth` : 'Photo Booth';
  renderThumbs();
</script>
</body>
</html>
